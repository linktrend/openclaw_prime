name: Linktrend Fast Checks

# A checkpoint push is intentionally absent.  Phase PR updates are the only
# automatic fast-check wake, and the PR concurrency key cancels obsolete work.
on:
  pull_request:
    branches: [development]
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      mode:
        description: "reconciled only; never a general manual Fast trigger"
        required: true
        type: choice
        options: [reconciled]
      expected_repository:
        description: "Exact same-repository owner/name"
        required: true
        type: string
      expected_commit:
        description: "Exact development 40-character commit"
        required: true
        type: string
      expected_tree:
        description: "Exact development 40-character Git tree"
        required: true
        type: string
      package_version:
        description: "Installed immutable managed-core version"
        required: true
        type: string
      installed_state_digest:
        description: "Canonical installed-state SHA-256"
        required: true
        type: string

permissions: {}

concurrency:
  group: ${{ github.repository }}|${{ github.workflow }}|pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fast:
    name: Linktrend Fast Checks
    if: >-
      github.event_name == 'pull_request' && startsWith(github.event.pull_request.head.ref, 'phase/')
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref }}
      BASELINE_REF: ${{ format('origin/{0}', github.event.pull_request.base.ref) }}
      BASELINE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout exact Phase PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1
          # Keep checkout's token-backed origin configuration for the bounded
          # baseline fetch below; do not reconstruct authentication in shell.
          persist-credentials: true

      - name: Fetch bounded baseline history
        env:
          HISTORICAL_APPROVAL_COMMIT: 452a7f1f31b1d1947d4bb992f91457e5a238ea31
          OCP01_BASE: 7aee52d52695ab50bfa13dd275a68d28a5cbbe6b
          OCP01_HEAD: 566d6f2140fd86c5fb6fee7da6d58b3629442287
          BASELINE_REFSPEC: ${{ format('+refs/heads/{0}:refs/remotes/origin/{0}', github.event.pull_request.base.ref) }}
          PHASE_REFSPEC: ${{ format('+refs/heads/{0}:refs/remotes/origin/{0}', github.event.pull_request.head.ref) }}
        run: |
          set -euo pipefail
          # actions/checkout configured origin with the scoped GitHub token.
          cleanup_checkout_credentials() {
            local key="http.https://github.com/.extraheader"
            local config_status
            if git config --local --get-all "${key}" >/dev/null; then
              git config --local --unset-all "${key}"
            else
              config_status=$?
              test "${config_status}" -eq 1 || return "${config_status}"
            fi
            if git config --local --get-all "${key}" >/dev/null; then
              echo "checkout_credentials_cleanup_failed" >&2
              return 1
            else
              config_status=$?
              test "${config_status}" -eq 1 || return "${config_status}"
            fi
          }
          trap cleanup_checkout_credentials EXIT
          git fetch --no-tags --depth=64 origin "${BASELINE_REFSPEC}" "${PHASE_REFSPEC}"
          # Snapshot validation needs one old authority object.
          git fetch --no-tags --depth=1 origin "${HISTORICAL_APPROVAL_COMMIT}"
          # OCP-01 focused tests need HEAD plus the short parent chain to
          # BASE. Do not unshallow or scan upstream-wide history.
          git fetch --no-tags --depth=8 origin "${OCP01_HEAD}"
          git cat-file -e "${HISTORICAL_APPROVAL_COMMIT}^{commit}"
          git cat-file -e "${OCP01_BASE}^{commit}"
          git cat-file -e "${OCP01_HEAD}^{commit}"
          git merge-base --is-ancestor "${OCP01_BASE}" "${OCP01_HEAD}"
          cleanup_checkout_credentials
          trap - EXIT

      - name: Reject stale or non-Phase dispatch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          live_branch="$(jq -r .head.ref <<<"${pr}")"
          live="$(jq -r .head.sha <<<"${pr}")"
          live_base="$(jq -r .base.sha <<<"${pr}")"
          case "${live_branch}" in phase/*) ;; *) echo "fast_checks_require_phase_branch: ${live_branch}"; exit 1;; esac
          test "${live}" = "${EXPECTED_HEAD}" || { echo "fast_checks_stale_pr_head: expected=${EXPECTED_HEAD} live=${live}"; exit 1; }
          test "${live_base}" = "${BASELINE_SHA}" || { echo "fast_checks_stale_pr_base: expected=${BASELINE_SHA} live=${live_base}"; exit 1; }
          actual="$(git rev-parse HEAD)"
          test "${actual}" = "${EXPECTED_HEAD}" || {
            echo "fast_checks_head_mismatch: expected=${EXPECTED_HEAD} actual=${actual}"
            exit 1
          }
          [[ "${BASELINE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "fast_checks_base_sha_invalid"; exit 1; }
          BASELINE_TREE="$(git rev-parse "${BASELINE_SHA}^{tree}")"
          [[ "${BASELINE_TREE}" =~ ^[0-9a-f]{40}$ ]] || { echo "fast_checks_base_tree_invalid"; exit 1; }
          printf 'BASELINE_TREE=%s\n' "${BASELINE_TREE}" >> "${GITHUB_ENV}"

      - name: Run fast profile
        run: |
          set -euo pipefail
          git diff --check "${BASELINE_SHA}" "${EXPECTED_HEAD}"
          python3 scripts/gitops/run_delivery_profile.py fast

      - name: Retain fast-check evidence
        if: always()
        run: |
          {
            echo "workflow=Linktrend Fast Checks"
            echo "repository=${GITHUB_REPOSITORY}"
            echo "pr=${PR_NUMBER}"
            echo "head=${EXPECTED_HEAD}"
            echo "runner=ubuntu-24.04-arm"
          } > fast-check-summary.txt

      - name: Upload fast-check evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linktrend-fast-check-${{ github.run_id }}
          path: fast-check-summary.txt
          retention-days: 30

      - name: Upload customization-validation evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: linktrend-fast-customization-evidence-${{ github.run_id }}
          path: customization-validation-evidence.json
          retention-days: 30

  reconciled-fast:
    name: Linktrend Fast Checks
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'reconciled'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    env:
      EXPECTED_REPOSITORY: ${{ inputs.expected_repository }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      PACKAGE_VERSION: ${{ inputs.package_version }}
      INSTALLED_STATE_DIGEST: ${{ inputs.installed_state_digest }}
    steps:
      - name: Checkout exact trusted development ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: development
          fetch-depth: 0
          persist-credentials: false
      - name: Bind reconciled Fast dispatch to exact installed development tree
        env:
          ACTUAL_REPOSITORY: ${{ github.repository }}
          WORKFLOW_REF: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          [[ "${EXPECTED_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || { echo reconciled_fast_commit_invalid; exit 1; }
          [[ "${EXPECTED_TREE}" =~ ^[0-9a-f]{40}$ ]] || { echo reconciled_fast_tree_invalid; exit 1; }
          [[ "${INSTALLED_STATE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo reconciled_fast_digest_invalid; exit 1; }
          python3 scripts/gitops/verify_reconciled_fast_dispatch.py \
            --repo . --expected-repository "${EXPECTED_REPOSITORY}" --actual-repository "${ACTUAL_REPOSITORY}" \
            --ref "${WORKFLOW_REF}" --expected-commit "${EXPECTED_COMMIT}" --expected-tree "${EXPECTED_TREE}" \
            --package-version "${PACKAGE_VERSION}" --installed-state-digest "${INSTALLED_STATE_DIGEST}"
      - name: Run exact Fast profile without cache or write authority
        run: |
          set -euo pipefail
          git diff --check
          python3 scripts/gitops/run_delivery_profile.py fast
