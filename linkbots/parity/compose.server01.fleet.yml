      - /srv/linktrend/deploy/helpers/openclaw-gateway-with-buzz-proxy.mjs:/opt/linktrend/openclaw-gateway-with-buzz-proxy.mjs:ro
      - /etc/linktrend/runtime-secrets/buzz/tls:/run/linktrend/buzz-tls:ro
      - /srv/linktrend/deploy/helpers/buzz-room-membership-tailnet.js:/var/lib/openclaw/david/.openclaw-david/npm/projects/openclaw-buzz-8413d3ef60/node_modules/@openclaw/buzz/dist/room-membership-a8IHfdgL.js:ro
    extra_hosts: ["linkserver-01.tailf7e13a.ts.net:172.22.0.250"]
